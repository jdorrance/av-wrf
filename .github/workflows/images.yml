name: images

on:
  pull_request:
    paths:
      - 'src/av_wrf/**'
      - 'scripts/**'
      - 'config/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    paths:
      - 'src/av_wrf/**'
      - 'scripts/**'
      - 'config/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: av-wrf:runtime
          cache-from: type=gha,scope=runtime-arm64
          cache-to: type=gha,scope=runtime-arm64,mode=max
      - run: docker run --rm --network none av-wrf:runtime check
      - run: docker run --rm --network none --entrypoint dpkg-query av-wrf:runtime -W ca-certificates libzstd1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: solver
          build-args: JOBS=2
          load: true
          tags: av-wrf:solver
          cache-from: type=gha,scope=solver-arm64
          # Preserve intermediate WRF/WPS layers across fresh hosted runners.
          cache-to: type=gha,scope=solver-arm64,mode=max
      - run: docker run --rm --network none av-wrf:solver check
      - run: >-
          docker run --rm --network none --user 65534:65534 --entrypoint python
          --mount "type=bind,source=$PWD/docker/check-icon-grib.py,target=/check-icon-grib.py,readonly"
          av-wrf:solver /check-icon-grib.py --ungrib /opt/av-wrf/bin/ungrib.exe
      - run: >-
          docker run --rm --network none --user 65534:65534 --entrypoint python
          --mount "type=bind,source=$PWD/docker/check-namelist.py,target=/check-namelist.py,readonly"
          av-wrf:solver /check-namelist.py
      - run: >-
          docker run --rm --network none --user 65534:65534 --entrypoint python
          --mount "type=bind,source=$PWD/docker,target=/checks,readonly"
          av-wrf:solver /checks/check-native.py /tmp/native-smoke
