# Fast-building Central Armenia 3 km pilot domain (100x100 mass-cell domain policy floor).
# Assumptions & Local Turnaround Design:
# - `e_we: 101, e_sn: 101` provides `100 x 100` computational mass cells (`300 x 300 km`),
#   satisfying NCAR WPS >= 100x100 domain-sizing guidance enforced by `av-wrf` domain policy
#   and yielding an `84 x 84` (`252 x 252 km`) published interior after 8-cell sponge trim.
# - Centered at `40.35N, 44.60E` (Mount Ara / Hrazdan corridor), framing Yerevan, Aparan,
#   Mount Aragats (`4,090 m`), Tsaghkadzor, Dilijan, Lake Sevan (`1,900 m`), Garni/Azat,
#   Vedi, Vayots Dzor, and Mount Ararat (`5,137 m`) in 3.2x fewer columns than `armenia-3km-v1`.
# - `dem_source: default` / `landuse_source: default` resolves stock WPS v4.7 `GEOGRID.TBL.ARW`
#   (`topo_gmted2010_30s` + `modis_landuse_20class_30s_with_lakes`) with zero custom table edits.
# References:
# - WPS domain sizing (>= 100x100): https://www2.mmm.ucar.edu/wrf/site/documentation/namelist.wps_best_practices.html
# - WPS static geography downloads: https://www2.mmm.ucar.edu/wrf/users/download/get_sources_wps_geog.html
profile_id: armenia-pilot-3km-v1
earth_radius_m: 6370000.0
center_lat_deg: 40.35
center_lon_deg: 44.60
std_parallel_1_deg: 39.50
std_parallel_2_deg: 41.20
central_meridian_deg: 44.60
dx_m: 3000.0
dy_m: 3000.0
e_we: 101
e_sn: 101
bdy_trim_cells: 8
e_vert: 51
exported_levels_k: 38
p_top_pa: 5000.0
auto_levels_opt: 2
dzbot_m: 34.0
dzstretch_s: 1.11
dzstretch_u: 1.06
max_dz_m: 850.0
min_bl_levels_2km_agl: 18
terrain_elevations_m: [800.0, 4090.0, 5137.0]
dem_source: default
landuse_source: default
geog_data_path: /opt/av-wrf/geog
