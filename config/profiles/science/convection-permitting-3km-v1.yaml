# Frozen Phase 1 convection-permitting 3 km physics & steep-terrain dynamics suite.
# Assumptions & Soaring Sensitivities:
# - Convection-permitting (`cu_physics: 0`, Thompson `mp_physics: 8`): deep convection is resolved
#   on the 3 km grid; shallow subgrid fair-weather `Cu` under YSU (`bl_pbl_physics: 1`) may remain
#   transparent in `CLDFRA` until Phase 5 benchmarks MYNN (`bl_pbl_physics: 5, icloud_bl: 1`).
# - Topographic shortwave (`ra_sw_physics: 4`, `radt_min: 3`, `slope_rad: 1`, `topo_shading: 1`,
#   `shadlen_m: 25000.0`): 3 km slope aspect and 25 km valley shadows drive Noah-MP `ACHFX` and
#   `T2` directly, replacing Dr. Jack RASP post-hoc `sfcsun` without consumer double-counting.
# - Steep-slope stability: `hybrid_opt: 2, etac: 0.2` (verified fold-free up to 5,137 m Ararat),
#   `diff_opt: 2, km_opt: 4` physical-space 3D deformation diffusion, `epssm: 0.3` acoustic
#   off-centering, `w_damping: 1`, and 5 km implicit Rayleigh upper sponge (`damp_opt: 3`).
# - Subgrid orographic drag (`gwd_opt: 0`): disabled at 3 km to avoid double-counting resolved
#   mountain-wave drag over the Lesser Caucasus; `topo_wind: 1` retains Jimenez ridge-crest drag.
# References:
# - WRF v4.8.0 releases: https://github.com/wrf-model/WRF/releases
# - WRF v4.8.0 Known Problems: https://github.com/wrf-model/WRF/wiki/WRF-V4.8.0-Known-Problems
# - WRF v4 Technical Note (NCAR/TN-556+STR): https://www2.mmm.ucar.edu/wrf/users/docs/technote/v4_technote.pdf
# - WRF Users' Guide Ch. 5: https://www2.mmm.ucar.edu/wrf/users/docs/user_guide_v4/v4.4/users_guide_chap5.html
profile_id: convection-permitting-3km-v1
wrf_version: "4.8.0"
wps_version: "4.7.0"
mp_physics: 8
ra_lw_physics: 4
ra_sw_physics: 4
radt_min: 3
slope_rad: 1
topo_shading: 1
shadlen_m: 25000.0
sf_surface_physics: 4
opt_runsrf: 1
opt_runsub: 1
bl_pbl_physics: 1
sf_sfclay_physics: 1
topo_wind: 1
ysu_topdown_pblmix: 0
shinhong_scu_mixing: 0
shinhong_nonlocal_flux: false
cu_physics: 0
gwd_opt: 0
gwd_if_nonhyd: false
use_theta_m: 1
base_temp_k: 300.0
hybrid_opt: 2
etac: 0.2
diff_opt: 2
km_opt: 4
diff_6th_opt: 2
diff_6th_factor: 0.12
epssm: 0.3
w_damping: 1
damp_opt: 3
zdamp_m: 5000.0
dampcoef: 0.2
time_step_s: 15
spec_bdy_width: 5
spec_zone: 1
relax_zone: 4
interval_seconds: 3600
nwp_diagnostics: 1
afwa_diag_opt: 1
afwa_severe_opt: 1
history_interval_min: 60
prec_acc_dt_min: 60
bucket_mm: 100.0
bucket_j: 1000000000.0
