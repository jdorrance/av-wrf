repos:
  - repo: local
    hooks:
      - id: check-repo
        name: check-repo (structure, DAG, budgets, SHA-256 locks)
        entry: python3 scripts/check_repo.py
        language: system
        pass_filenames: false
      - id: check-reference
        name: generate-reference --check (docs & markdown links)
        entry: python3 scripts/generate_reference.py --check
        language: system
        pass_filenames: false
      - id: tach-check
        name: tach check
        entry: uv run tach check
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check & format
        entry: bash -c "uv run ruff check && uv run ruff format --check"
        language: system
        pass_filenames: false
      - id: mypy-strict
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
