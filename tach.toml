exclude = ["build", "dist", ".venv", "vendor", "output", "runs", "work", "scratch"]
source_roots = ["src"]
exact = true

[[modules]]
path = "av_wrf.contracts"
depends_on = []
strict = true

[[modules]]
path = "av_wrf.core"
depends_on = ["av_wrf.contracts"]
strict = true

[[modules]]
path = "av_wrf.codecs"
depends_on = ["av_wrf.contracts", "av_wrf.core"]
strict = true

[[modules]]
path = "av_wrf.runner"
depends_on = ["av_wrf.contracts", "av_wrf.core", "av_wrf.codecs"]
strict = true

[[modules]]
path = "av_wrf.verify"
depends_on = ["av_wrf.contracts", "av_wrf.core", "av_wrf.codecs"]
strict = true

[[modules]]
path = "av_wrf.cli"
depends_on = ["av_wrf.contracts", "av_wrf.runner", "av_wrf.verify"]
strict = true
