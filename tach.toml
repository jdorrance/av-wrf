exclude = [
    ".venv",
    "build",
    "dist",
    "output",
    "runs",
    "scratch",
    "vendor",
    "work",
]
source_roots = [
    "src",
]
exact = true

[[modules]]
path = "av_wrf.cli"
depends_on = [
    "av_wrf.runner",
]

[[modules]]
path = "av_wrf.codecs"
depends_on = [
    "av_wrf.contracts",
    "av_wrf.core",
]

[[modules]]
path = "av_wrf.contracts"
depends_on = []

[[modules]]
path = "av_wrf.core"
depends_on = [
    "av_wrf.contracts",
]

[[modules]]
path = "av_wrf.runner"
depends_on = [
    "av_wrf.codecs",
    "av_wrf.contracts",
    "av_wrf.core",
]

[[modules]]
path = "av_wrf.verify"
depends_on = [
    "av_wrf.core",
]

[[interfaces]]
expose = [
    "[A-Za-z][A-Za-z0-9_]*",
]
from = [
    "av_wrf.contracts",
    "av_wrf.core",
    "av_wrf.codecs",
    "av_wrf.runner",
    "av_wrf.verify",
    "av_wrf.cli",
]
